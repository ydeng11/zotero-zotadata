name: Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Build production XPI
        run: NODE_ENV=production npm run build

      - name: Assert unused Toolkit handlers are absent
        run: bash .github/ci/assert-xpi-no-toolkit-protocols.sh .scaffold/dist/zotadata.xpi

      - name: Run test suite
        run: npm test -- --run
